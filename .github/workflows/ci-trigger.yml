name: CI

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  # Lint + typecheck + test via the shared composite (runs `pnpm run lint`,
  # `pnpm run --if-present typecheck`, `pnpm run --if-present test`).
  ci:
    name: CI - lint / typecheck / test
    runs-on: ubuntu-latest
    steps:
      - uses: 0xPolygon/pipelines/.github/actions/ci@main

  # Publish-readiness: build both packages (dual CJS+ESM) and every example
  # (the consumer-compatibility gate — examples resolve the workspace from
  # source), then run publint against the built packages.
  build:
    name: Build & package checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run check:exports

  # Generated-artifact drift (API.md + public-API baseline) via the shared
  # workflow, driven by each package's `codegen-drift-check` script.
  drift-check:
    uses: 0xPolygon/pipelines/.github/workflows/apps-codegen-drift-check.yml@main
